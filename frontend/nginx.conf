server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: any path that isn't a real file falls back to
    # index.html so client-side routing (react-router-dom) works on
    # a hard refresh/deep link.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
